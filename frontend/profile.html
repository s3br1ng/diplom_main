<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="nav-bar">
        <a href="profile.html?token=${token}" class="nav-button">Профиль</a>
        <a href="events.html?token=${token}" class="nav-button">Мероприятия</a>
    </div>

    <div class="centered-container">
        <h1>Профиль</h1>
        <p id="user-info"></p>
        <button onclick="logout()">Выйти</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        async function loadUserInfo() {
            try {
                const response = await fetch(`http://127.0.0.1:8000/profile?token=${token}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('user-info').textContent = `ID: ${user.id}, Никнейм: ${user.nickname}`;}
            } catch (err) {
                document.getElementById('user-info').textContent = 'Произошла ошибка при загрузке данных.';
                console.error(err);
            }
        }

        loadUserInfo();

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
