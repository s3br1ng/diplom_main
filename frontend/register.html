<!-- frontend/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="centered-container">
        <h1>Регистрация</h1>
        <form id="register-form">
            <input type="text" id="nickname" placeholder="Никнейм" required><br><br>
            <input type="password" id="password" placeholder="Пароль" required><br><br>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <p id="message"></p>
        <a href="index.html" class="button">Назад</a>
    </div>

    <script src="scripts.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('nickname').value;
            const password = document.getElementById('password').value;
        
            try {
                const response = await fetch('http://127.0.0.1:8000/register', {  // Правильный URL
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, password })
                });
        
                if (response.ok) {
                    document.getElementById('message').textContent = 'Вы успешно зарегистрированы!';
                } else {
                    const error = await response.json();
                    document.getElementById('message').textContent = error.detail || 'Ошибка регистрации';
                }
            } catch (err) {
                document.getElementById('message').textContent = 'Произошла ошибка при отправке данных.';
                console.error(err); // Выводим ошибку в консоль браузера
            }
        });
        </script>
</body>
</html>
